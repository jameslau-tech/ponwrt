name: Release PonWrt 2

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  actions: write
env:
  WRT_IP: 192.168.5.1
  TZ: Asia/Shanghai

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      wrt_date: ${{ steps.metadata.outputs.wrt_date }}
    steps:
      - name: Set release date
        id: metadata
        run: echo "wrt_date=$(date +'%y.%m.%d-%H.%M.%S')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    env:
       WRT_DATE: ${{ needs.prepare.outputs.wrt_date }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Set Environment Variable
        run: |      
          # echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_NAME=XG040-${{ matrix.target }}" >> $GITHUB_ENV

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

            if [[ -n "$TZ" ]]; then
              sudo timedatectl set-timezone "$TZ"
            else
              echo "TZ is not set, skipping timezone setup."
            fi

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install third-party packages
        run: |
          cd ./package
          chmod +x $GITHUB_WORKSPACE/utils/update-packages.sh
          bash $GITHUB_WORKSPACE/utils/update-packages.sh  

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          else
            echo "signing key not found."
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}-2.config" \
            configs/release-2.config > .config
          chmod +x $GITHUB_WORKSPACE/utils/setting.sh
          bash $GITHUB_WORKSPACE/utils/setting.sh
          make defconfig
          [ -e .config ] && cp .config defconfig-final.config

      - name: Upload build config files
        uses: actions/upload-artifact@v6
        with:
          name: build-config-${{ matrix.target }}
          path: |
            defconfig-final.config

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WRT_DATE: ${{ needs.prepare.outputs.wrt_date }}
      
    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.WRT_DATE }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
